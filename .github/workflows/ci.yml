name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bash \
            coreutils \
            tar \
            zip \
            unzip \
            xz-utils \
            shellcheck \
            rclone

      - name: Shell syntax validation
        run: |
          bash -n *.sh lib/*.sh tests/*.sh

      - name: ShellCheck static analysis
        run: |
          shellcheck --severity=warning -x *.sh lib/*.sh tests/*.sh

      - name: Run test suite
        run: |
          bash tests/run_tests.sh
